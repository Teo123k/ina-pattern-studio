services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ina_pattern_studio
      POSTGRES_USER: ina
      POSTGRES_PASSWORD: development-only-change-me
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ina -d ina_pattern_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
